name: Restream YouTube to Twitch

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Start Live Stream Loop
        env:
          TWITCH_KEY: ${{ secrets.TWITCH_STREAM_KEY }}
          YT_URL: "https://www.youtube.com/live/uYIwz9Wv6tk"
        run: |
          while true; do
            echo "Fetching direct stream URL with authenticated Cookies & User-Agent..."
            
            DIRECT_URL=$(yt-dlp --cookies cookies.txt \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --extractor-args "youtube:player_client=web,android" \
              -g --format "best[ext=mp4]/best" "$YT_URL" || true)
            
            if [ -n "$DIRECT_URL" ]; then
              echo "Direct URL extracted successfully! Connecting to Twitch..."
              ffmpeg -re -i "$DIRECT_URL" \
              -c:v copy -c:a aac -b:a 160k -ar 44100 \
              -f flv "rtmp://maa.contribute.live-video.net/app/$TWITCH_KEY" || true
            else
              echo "Failed to get stream URL. Retrying in 10 seconds..."
            fi

            echo "Reconnecting in 10 seconds..."
            sleep 10
          done
