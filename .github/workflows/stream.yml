name: Restream YouTube to Twitch

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Decode Cookies File
        env:
          COOKIES_BASE64: ${{ secrets.YT_COOKIES_BASE64 }}
        run: |
          echo "$COOKIES_BASE64" | base64 -d > cookies.txt

      - name: Start Live Stream Loop
        env:
          TWITCH_KEY: ${{ secrets.TWITCH_STREAM_KEY }}
          YT_URL: "https://www.youtube.com/live/uYIwz9Wv6tk"
        run: |
          while true; do
            echo "Fetching direct stream URL using Cookies..."
            
            DIRECT_URL=$(yt-dlp --cookies cookies.txt -g --format "best[ext=mp4]/best" "$YT_URL" 2>/dev/null || true)
            
            if [ -n "$DIRECT_URL" ]; then
              echo "Connecting to Twitch..."
              ffmpeg -re -i "$DIRECT_URL" \
              -c:v copy -c:a aac -b:a 160k -ar 44100 \
              -f flv "rtmp://maa.contribute.live-video.net/app/$TWITCH_KEY" || true
            else
              echo "Failed to get stream URL. Retrying..."
            fi

            echo "Stream disconnected. Reconnecting in 10 seconds..."
            sleep 10
          done
